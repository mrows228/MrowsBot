<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MrowsBot</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

<style>

:root{

    --bg1:#0d1026;
    --bg2:#18163b;

    --card:#232544;

    --accent:#8b5cf6;
    --accent2:#b06cff;

    --text:#ffffff;
    --muted:#b7b9d6;

    --danger:#ff5f7a;

    --radius:24px;

}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
        linear-gradient(
            160deg,
            var(--bg1),
            var(--bg2)
        );

    color:var(--text);

    font-family:
        Inter,
        sans-serif;

    min-height:100vh;

    overflow-x:hidden;
}

.app{
    padding:20px;
    padding-bottom:120px;
}

.header{
    display:flex;
    align-items:center;
    gap:16px;

    margin-bottom:24px;
}

.logo{

    width:74px;
    height:74px;

    border-radius:22px;

    object-fit:cover;

    animation:
        logoFloat 4s ease-in-out infinite;

    box-shadow:
        0 0 30px rgba(139,92,246,.35);
}

@keyframes logoFloat{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-6px);
    }

    100%{
        transform:translateY(0px);
    }
}

.header h1{
    font-size:42px;
    font-weight:800;
}

.header p{
    color:var(--muted);
}

.main-content{
    position:relative;
    min-height:100vh;
    overflow:hidden;
}

.tab-content{

    position:absolute;
    inset:0;

    opacity:0;

    transform:
        perspective(1400px)
        rotateY(18deg)
        translateX(40px);

    transition:
        opacity 1s ease,
        transform 1s ease;

    pointer-events:none;
}

.tab-content.active{

    opacity:1;

    transform:
        perspective(1400px)
        rotateY(0deg)
        translateX(0);

    pointer-events:auto;
}

.card{

    background:
        rgba(35,37,68,.88);

    border:
        1px solid rgba(255,255,255,.06);

    border-radius:var(--radius);

    padding:22px;

    margin-bottom:20px;

    backdrop-filter:blur(18px);

    box-shadow:
        0 0 45px rgba(0,0,0,.24);
}

.card h2{
    margin-bottom:18px;
}

input{

    width:100%;

    border:none;

    outline:none;

    background:#313456;

    color:white;

    border-radius:18px;

    padding:16px;

    margin-bottom:14px;

    font-size:15px;
}

button{

    border:none;

    cursor:pointer;

    transition:.35s;
}

.primary-btn{

    width:100%;

    padding:16px;

    border-radius:18px;

    color:white;

    font-weight:700;

    background:
        linear-gradient(
            45deg,
            var(--accent),
            var(--accent2)
        );
}

.primary-btn:hover{
    transform:translateY(-2px);
}

.bottom-nav{

    position:fixed;

    left:12px;
    right:12px;
    bottom:12px;

    display:flex;
    gap:10px;

    padding:10px;

    border-radius:28px;

    background:
        rgba(18,20,40,.92);

    backdrop-filter:blur(16px);

    z-index:999;
}

.nav-btn{

    flex:1;

    padding:14px;

    border-radius:18px;

    color:white;

    background:#262947;

    font-weight:600;
}

.nav-btn.active{

    background:
        linear-gradient(
            45deg,
            var(--accent),
            var(--accent2)
        );

    box-shadow:
        0 0 25px rgba(139,92,246,.45);
}

.item-card{

    background:#313456;

    border-radius:22px;

    padding:18px;

    margin-bottom:16px;

    animation:fade .5s ease;
}

.item-title{
    font-size:21px;
    font-weight:700;
    margin-bottom:8px;
}

.item-text{
    color:#d5d8ff;
    line-height:1.7;
}

.item-date{
    margin-top:12px;
    color:#aaaef5;
}

.item-actions{

    display:flex;
    gap:10px;

    margin-top:18px;
}

.edit-btn,
.delete-btn{

    flex:1;

    padding:13px;

    border-radius:16px;

    color:white;
}

.edit-btn{
    background:
        linear-gradient(
            45deg,
            #7b5cff,
            #a970ff
        );
}

.delete-btn{
    background:#5a3340;
}

.fade-in{
    animation:fade .5s ease;
}

@keyframes fade{

    from{
        opacity:0;
        transform:translateY(12px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

.motivation-box{

    margin-bottom:18px;

    background:
        linear-gradient(
            135deg,
            rgba(139,92,246,.18),
            rgba(96,165,250,.10)
        );

    border:
        1px solid rgba(255,255,255,.08);

    border-radius:24px;

    padding:18px;

    line-height:1.7;

    color:white;

    animation:fade 1s ease;
}

.ql-toolbar{

    border:none !important;

    border-radius:18px 18px 0 0;

    background:#2a2d4d;
}

.ql-container{

    border:none !important;

    background:#313456;

    border-radius:0 0 18px 18px;

    color:white;

    min-height:180px;

    font-size:16px;
}

.ql-editor{
    color:white;
}

.ql-snow .ql-stroke{
    stroke:white !important;
}

.ql-snow .ql-fill{
    fill:white !important;
}

.ql-picker{
    color:white !important;
}

#toast{

    position:fixed;

    left:50%;
    bottom:100px;

    transform:translateX(-50%);

    background:#1f223d;

    color:white;

    padding:14px 24px;

    border-radius:18px;

    opacity:0;

    transition:.4s;

    z-index:9999;
}

#toast.show{
    opacity:1;
}

.empty-card{

    background:#2c2f50;

    border-radius:20px;

    padding:20px;

    text-align:center;

    color:#b8bbe0;
}

</style>
</head>
<body>

<div class="app">

<div class="header">

<img src="logo.png" class="logo">

<div>
<h1>MrowsBot</h1>
<p>Твой личный помощник и дневник</p>
</div>

</div>

<div class="main-content">

<!-- NOTES -->

<div class="tab-content active" id="notes">

<div class="card">

<h2>📝 Добавить заметку</h2>

<input id="noteTitle" placeholder="Название">

<input id="noteText" placeholder="Текст">

<button class="primary-btn" id="addNoteBtn">
Сохранить
</button>

</div>

<div id="notesList"></div>

</div>

<!-- STUDY -->

<div class="tab-content" id="study">

<div class="motivation-box" id="motivationText"></div>

<div class="card">

<h2>📚 Учебная запись</h2>

<input id="studyTitle" placeholder="Тема / предмет">

<div id="studyEditor"></div>

<br>

<button class="primary-btn" id="addStudyBtn">
Сохранить
</button>

</div>

<div id="studyList"></div>

</div>

<!-- REMINDER -->

<div class="tab-content" id="reminders">

<div class="card">

<h2>⏰ Напоминание</h2>

<input id="reminderTitle" placeholder="Название">

<input id="reminderText" placeholder="Описание">

<input type="date" id="reminderDate">

<input type="time" id="reminderTime">

<button class="primary-btn" id="addReminderBtn">
Создать
</button>

</div>

<div id="reminderList"></div>

</div>

<!-- PERSONAL -->

<div class="tab-content" id="personal">

<div class="card">

<h2>🌙 Личное</h2>

<input id="personalTitle" placeholder="Заголовок">

<input id="personalText" placeholder="Текст">

<button class="primary-btn" id="addPersonalBtn">
Сохранить
</button>

</div>

<div id="personalList"></div>

</div>

</div>

</div>

<div class="bottom-nav">

<button class="nav-btn active" data-tab="notes">
Заметки
</button>

<button class="nav-btn" data-tab="study">
Учёба
</button>

<button class="nav-btn" data-tab="reminders">
Напоминания
</button>

<button class="nav-btn" data-tab="personal">
Личное
</button>

<button class="nav-btn" id="supportBtn">
Поддержка
</button>

</div>

<div id="toast"></div>

<script>

const tg = window.Telegram?.WebApp;

const STORAGE_KEY = 'mrowsbot_v6';

const motivations = [

"Даже 15 минут учебы — уже победа.",
"СДВГ не делает тебя слабым.",
"Ты не обязан быть идеальным.",
"Начни с маленького шага.",
"Один конспект сегодня — минус стресс завтра.",
"Ты способен на большее.",
"Главное — продолжать движение.",
"Даже если тяжело — ты справляешься.",
"Твой темп — нормальный.",
"Сейчас сложно, потом станет легче.",
"Минимальный прогресс лучше нуля.",
"Ты уже молодец что открыл приложение.",
"Мозгу нужен отдых — и это нормально.",
"Фокус не всегда приходит сразу.",
"Учеба — инвестиция в свободу.",
"Ты растешь каждый день.",
"Не сравнивай себя с другими.",
"Сделай это ради себя будущего.",
"Даже гении уставали.",
"Просто начни."

];

let state =
    JSON.parse(
        localStorage.getItem(STORAGE_KEY)
    ) || {

        notes:[],
        studies:[],
        reminders:[],
        personal:[]
};

function saveState(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(state)
    );
}

function uid(){
    return Date.now() +
        Math.random().toString(16).slice(2);
}

function showToast(text){

    const toast =
        document.getElementById('toast');

    toast.textContent = text;

    toast.classList.add('show');

    setTimeout(()=>{
        toast.classList.remove('show');
    },2500);
}

function switchTab(tab){

    const current =
        document.querySelector(
            '.tab-content.active'
        );

    if(current){
        current.classList.remove('active');
    }

    setTimeout(()=>{

        document
            .getElementById(tab)
            .classList.add('active');

    },250);

    document
        .querySelectorAll('.nav-btn')
        .forEach(btn=>{
            btn.classList.remove('active');
        });

    const activeBtn =
        document.querySelector(
            `[data-tab="${tab}"]`
        );

    if(activeBtn){
        activeBtn.classList.add('active');
    }
}

function createCard(item,type){

    const card =
        document.createElement('div');

    card.className =
        'item-card fade-in';

    let extra='';

    if(type==='reminders'){

        extra =
        `
        <div class="item-date">
            ⏰ ${item.date} ${item.time}
        </div>
        `;
    }

    card.innerHTML =

    `
    <div class="item-title">
        ${item.title}
    </div>

    <div class="item-text">
        ${item.text}
    </div>

    ${extra}

    <div class="item-actions">

        <button class="edit-btn">
            ✏️ Изменить
        </button>

        <button class="delete-btn">
            🗑 Удалить
        </button>

    </div>
    `;

    card
        .querySelector('.delete-btn')
        .onclick = ()=>{

        state[type] =
            state[type]
            .filter(x=>x.id!==item.id);

        saveState();

        renderAll();

        showToast('Удалено');
    };

    card
        .querySelector('.edit-btn')
        .onclick = ()=>{

        const newTitle =
            prompt(
                'Изменить заголовок:',
                item.title
            );

        if(newTitle===null) return;

        const newText =
            prompt(
                'Изменить текст:',
                item.text
            );

        if(newText===null) return;

        item.title = newTitle;
        item.text = newText;

        if(type==='reminders'){

            const newDate =
                prompt(
                    'Новая дата:',
                    item.date
                );

            if(newDate!==null){
                item.date = newDate;
            }

            const newTime =
                prompt(
                    'Новое время:',
                    item.time
                );

            if(newTime!==null){
                item.time = newTime;
            }
        }

        saveState();

        renderAll();

        showToast('Изменено');
    };

    return card;
}

function renderSection(type,id){

    const container =
        document.getElementById(id);

    container.innerHTML='';

    if(state[type].length===0){

        container.innerHTML =

        `
        <div class="empty-card">
            Пока пусто
        </div>
        `;

        return;
    }

    state[type].forEach(item=>{

        container.appendChild(
            createCard(item,type)
        );
    });
}

function renderAll(){

    renderSection(
        'notes',
        'notesList'
    );

    renderSection(
        'studies',
        'studyList'
    );

    renderSection(
        'reminders',
        'reminderList'
    );

    renderSection(
        'personal',
        'personalList'
    );
}

function addSimpleItem(
    type,
    titleId,
    textId
){

    const title =
        document
        .getElementById(titleId)
        .value
        .trim();

    const text =
        document
        .getElementById(textId)
        .value
        .trim();

    if(!title || !text){

        showToast(
            'Заполни поля'
        );

        return;
    }

    state[type].push({

        id:uid(),

        title,
        text
    });

    saveState();

    renderAll();

    document
        .getElementById(titleId)
        .value='';

    document
        .getElementById(textId)
        .value='';

    showToast('Сохранено');
}

function addReminder(){

    const title =
        document
        .getElementById(
            'reminderTitle'
        )
        .value
        .trim();

    const text =
        document
        .getElementById(
            'reminderText'
        )
        .value
        .trim();

    const date =
        document
        .getElementById(
            'reminderDate'
        )
        .value;

    const time =
        document
        .getElementById(
            'reminderTime'
        )
        .value;

    if(
        !title ||
        !text ||
        !date ||
        !time
    ){

        showToast(
            'Заполни поля'
        );

        return;
    }

    state.reminders.push({

        id:uid(),

        title,
        text,
        date,
        time,

        notified:false
    });

    saveState();

    renderAll();

    showToast(
        'Напоминание создано'
    );
}

function checkReminders(){

    const now = new Date();

    state.reminders.forEach(r=>{

        if(r.notified) return;

        const reminderDate =
            new Date(
                `${r.date}T${r.time}`
            );

        if(now >= reminderDate){

            r.notified = true;

            showToast(
                `🔔 ${r.title}`
            );

            if(tg?.showAlert){

                tg.showAlert(
                    `${r.title}\n\n${r.text}`
                );
            }

            if(
                Notification.permission
                ===
                'granted'
            ){

                new Notification(
                    r.title,
                    {
                        body:r.text,
                        icon:'logo.png'
                    }
                );
            }

            saveState();
        }
    });
}

document
.addEventListener(
'DOMContentLoaded',
()=>{

    if(tg){

        tg.ready();

        tg.expand();

        tg.setHeaderColor(
            '#17192f'
        );
    }

    if("Notification" in window){

        Notification
        .requestPermission();
    }

    const studyEditor =
        new Quill(
            '#studyEditor',
            {

            theme:'snow',

            modules:{

                toolbar:[

                    [
                        {
                            header:
                            [1,2,3,false]
                        }
                    ],

                    [
                        'bold',
                        'italic',
                        'underline',
                        'strike'
                    ],

                    [
                        {
                            size:[
                                'small',
                                false,
                                'large',
                                'huge'
                            ]
                        }
                    ],

                    [
                        {
                            list:'ordered'
                        },
                        {
                            list:'bullet'
                        }
                    ],

                    [
                        {
                            align:[]
                        }
                    ],

                    [
                        'blockquote',
                        'code-block'
                    ],

                    [
                        'link',
                        'image'
                    ],

                    [
                        'clean'
                    ]
                ]
            }
        });

    document
        .getElementById(
            'motivationText'
        )
        .textContent =

        motivations[
            Math.floor(
                Math.random()
                *
                motivations.length
            )
        ];

    renderAll();

    setInterval(
        checkReminders,
        15000
    );

    document
        .querySelectorAll('.nav-btn')
        .forEach(btn=>{

        btn.onclick = ()=>{

            if(btn.dataset.tab){

                switchTab(
                    btn.dataset.tab
                );
            }
        };
    });

    document
        .getElementById(
            'addNoteBtn'
        )
        .onclick = ()=>{

        addSimpleItem(
            'notes',
            'noteTitle',
            'noteText'
        );
    };

    document
        .getElementById(
            'addPersonalBtn'
        )
        .onclick = ()=>{

        addSimpleItem(
            'personal',
            'personalTitle',
            'personalText'
        );
    };

    document
        .getElementById(
            'addReminderBtn'
        )
        .onclick = addReminder;

    document
        .getElementById(
            'addStudyBtn'
        )
        .onclick = ()=>{

        const title =
            document
            .getElementById(
                'studyTitle'
            )
            .value
            .trim();

        const text =
            studyEditor
            .root
            .innerHTML;

        if(
            !title ||
            text === '<p><br></p>'
        ){

            showToast(
                'Заполни поля'
            );

            return;
        }

        state.studies.push({

            id:uid(),

            title,
            text
        });

        saveState();

        renderAll();

        document
            .getElementById(
                'studyTitle'
            )
            .value='';

        studyEditor
            .root
            .innerHTML='';

        showToast(
            'Учебная запись сохранена'
        );
    };

    document
        .getElementById(
            'supportBtn'
        )
        .onclick = ()=>{

        alert(

`Техническая поддержка

@dmcpavel

Сообщить о багах`
        );
    };

});

</script>
</body>
</html>
